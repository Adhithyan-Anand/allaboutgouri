services:
  web:
    build: .
    image: allaboutgouri:latest
    container_name: allaboutgouri
    restart: unless-stopped
    # Only reachable from this machine. Cloudflare reaches it through the tunnel,
    # so nothing is exposed to the internet directly.
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Cloudflare Tunnel. Start with:  docker compose --profile tunnel up -d
  # Skip this if cloudflared already runs on your server; point it at http://localhost:8088 instead.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: allaboutgouri-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
